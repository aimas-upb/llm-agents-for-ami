# Deploy the AmI HMAS demonstrator website to GitHub Pages.
# Triggered on any push to `emas2026` that touches website/ files,
# or manually via workflow_dispatch.
#
# Setup required (one-time, in repo Settings → Pages):
#   Source → GitHub Actions

name: Deploy Demonstrator Website

on:
  push:
    branches: [emas2026]
    paths:
      - "website/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-flight runs on new push.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload website/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

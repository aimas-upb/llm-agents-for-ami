# Deploy the AmI HMAS demonstrator website to GitHub Pages.
# Pushes website/ to the gh-pages branch — no environment protection needed.
#
# Setup required (one-time, in repo Settings → Pages):
#   Source → Deploy from a branch → gh-pages → / (root)

name: Deploy Demonstrator Website

on:
  push:
    branches: [emas2026]
    paths:
      - "website/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy website/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          force_orphan: true

# Environment Configuration
# Defines the smart environment connection and discovery settings

environment:
  # Discovery method: 'direct', 'well_known', 'mdns'
  discovery_method: 'mdns'

  # Direct discovery configuration (when discovery_method is 'direct')
  direct:
    td_directory_url: null  # e.g., "http://192.168.1.100:8080/td-directory"

  # Well-known URI discovery configuration
  well_known:
    base_structure: null  # e.g., "house/{building}/{room}"
    query_service_uri: null  # e.g., "https://discovery.example.com/query"

  # mDNS discovery configuration
  mdns:
    service_type: "_ami-hmas._tcp.local"
    timeout: 5  # seconds

  # Integration Engine settings
  integration_engine:
    # Type of environment: 'yggdrasil' or 'homeassistant'
    environment_type: 'homeassistant'

    # HomeAssistant specific configuration
    homeassistant:
      url: null  # e.g., "http://homeassistant.local:8123"
      access_token: null  # Long-lived access token

      # Mapping configuration
      mapping:
        create_floor_workspaces: true
        create_area_workspaces: true
        create_logical_area_workspaces: true  # Based on device labels
        logical_area_labels:
          - "kids corner"
          - "my desk"
          - "study area"

        # Requires user acknowledgment before finalizing
        require_user_acknowledgment: true

    # Yggdrasil specific configuration
    yggdrasil:
      url: null  # e.g., "http://localhost:8080"
      workspace_root: "/"

# External Services Configuration
external_services:
  enabled: true

  # User-specific workspace for external services
  user_workspace_name: "external_services"

  # Service grouping into sub-workspaces
  grouping:
    enabled: true
    categories:
      - productivity
      - personal_bookkeeping
      - team_discussion
      - weather_and_environment

  # Initial service configurations
  services:
    # Google Calendar example
    - name: "google_calendar"
      type: "calendar"
      category: "productivity"
      enabled: false
      config:
        api_endpoint: null
        credentials_path: null

    # Weather API example
    - name: "weather_api"
      type: "weather"
      category: "weather_and_environment"
      enabled: false
      config:
        api_endpoint: null
        api_key: null

    # Air Quality API example
    - name: "air_quality_api"
      type: "air_quality"
      category: "weather_and_environment"
      enabled: false
      config:
        api_endpoint: null
        api_key: null

    # Google Spreadsheets example
    - name: "google_sheets"
      type: "spreadsheet"
      category: "productivity"
      enabled: false
      config:
        api_endpoint: null
        credentials_path: null

# Notification settings for environment changes
notifications:
  enabled: true
  events:
    - artifact_added
    - artifact_removed
    - capability_changed
    - state_changed

# Environment Configuration
# Lists the smart environments the agents can run in, and the settings they
# share. Each environment has its own definition file (discovery, clock,
# integration engine) under environments/.
#
# ConfigLoader.load_environment_config() loads this file and then loads the
# default entry's definition as the `environment` section. For example, with
# CURRENT_ENVIRONMENT=homebench, `environment` is environments/homebench.yaml.

environments:
  # Entry the agents start in; must be a key of `entries`.
  default: "${CURRENT_ENVIRONMENT:-lab308}"

  # Entry id -> definition file, relative to this file. Several homes can
  # share signifiers through one community store (see `community` below).
  entries:
    lab308: "environments/lab308.yaml"
    homebench: "environments/homebench.yaml"

# External Services Configuration
external_services:
  enabled: true

  # User-specific workspace for external services
  user_workspace_name: "external_services"

  # Service grouping into sub-workspaces
  grouping:
    enabled: true
    categories:
      - productivity
      - personal_bookkeeping
      - team_discussion
      - weather_and_environment

  # Initial service configurations
  services:
    # Google Calendar example
    - name: "google_calendar"
      type: "calendar"
      category: "productivity"
      enabled: false
      config:
        api_endpoint: null
        credentials_path: null

    # Weather API example
    - name: "weather_api"
      type: "weather"
      category: "weather_and_environment"
      enabled: false
      config:
        api_endpoint: null
        api_key: null

    # Air Quality API example
    - name: "air_quality_api"
      type: "air_quality"
      category: "weather_and_environment"
      enabled: false
      config:
        api_endpoint: null
        api_key: null

    # Google Spreadsheets example
    - name: "google_sheets"
      type: "spreadsheet"
      category: "productivity"
      enabled: false
      config:
        api_endpoint: null
        credentials_path: null

# Notification settings for environment changes
notifications:
  enabled: true
  events:
    - artifact_added
    - artifact_removed
    - capability_changed
    - state_changed

# Community Signifier API (shared service)
community:
  api_url: "${COMMUNITY_API_URL:-http://localhost:8085}"
  timeout: "${COMMUNITY_TIMEOUT:-10.0}"

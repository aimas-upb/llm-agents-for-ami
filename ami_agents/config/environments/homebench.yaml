# Environment definition: Home Bench
# Listed under `environments.entries` in ../environment.yaml; when it is the
# default entry, ConfigLoader.load_environment_config() loads this file as the
# `environment` config section.

name: "Home Bench"

# Discovery method: 'direct', 'well_known', 'mdns'
discovery_method: "${ENV_DISCOVERY_METHOD:-mdns}"

# Where plans read the time from (shared/utils/clock.py): the system clock, or
# a clock read over HTTP -- e.g. SimuHome's virtual time through SHTD:
#   CLOCK_SOURCE=http CLOCK_URL=http://localhost:8097/_shtd/time
clock:
  source: "${CLOCK_SOURCE:-system}"
  http:
    url: "${CLOCK_URL:-}"
    field: "now"
    format: "%Y-%m-%d %H:%M:%S"

# Direct discovery configuration (when discovery_method is 'direct')
direct:
  td_directory_url: null  # e.g., "http://192.168.1.100:8080/td-directory"

# Well-known URI discovery configuration
well_known:
  base_structure: null  # e.g., "house/{building}/{room}"
  query_service_uri: null  # e.g., "https://discovery.example.com/query"

# mDNS discovery configuration
mdns:
  service_type: "_ami-hmas._tcp.local"
  timeout: 5  # seconds

# Integration Engine settings
integration_engine:
  # Type of environment: 'yggdrasil' or 'homeassistant'
  environment_type: 'homeassistant'

  # HomeAssistant specific configuration
  homeassistant:
    url: "${HOMEBENCH_HA_URL:-http://localhost:8124}"
    access_token: null  # Long-lived access token

    # Mapping configuration
    mapping:
      create_floor_workspaces: true
      create_area_workspaces: true
      create_logical_area_workspaces: true  # Based on device labels
      logical_area_labels:
        - "kids corner"
        - "my desk"
        - "study area"

      # Requires user acknowledgment before finalizing
      require_user_acknowledgment: true

  # Yggdrasil specific configuration. YGGDRASIL_URL overrides the URL of
  # whichever environment is the default.
  yggdrasil:
    url: "${YGGDRASIL_URL:-http://localhost:8090/}"
    workspace_root: "/"

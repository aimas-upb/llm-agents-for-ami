# Agent Configuration
# Defines settings for all agents in the AMI system.
#
# Conventions:
# - Only keys actually consumed by Python code live here. SPADE host/port
#   are picked up from the JID and the SPADE library's own env vars; they
#   are not read from this file.
# - Env-var substitution: "${VAR:-default}" -> reads VAR or falls back.

# UserAssistant Agent Configuration
user_assistant:
  jid: "user_assistant@localhost"
  password: "${SPADE_USER_ASSISTANT_PASSWORD}"

# EnvExplorer Agent Configuration
env_explorer:
  jid: "env_explorer@localhost"
  password: "${SPADE_ENV_EXPLORER_PASSWORD}"

  # Experience Engine — signifier registry, matcher, optional SHACL validator.
  experience_engine:
    default_matcher_version: "${SIGNIFIER_MATCHER_VERSION:-v3}"
    default_min_similarity: "${SIGNIFIER_MIN_SIMILARITY:-0.5}"
    signifier_limit: "${SIGNIFIER_LIMIT:-10000}"
    shacl_validation_enabled: "${SHACL_VALIDATION_ENABLED:-true}"
    enable_shacl_cache: "${SHACL_CACHE_ENABLED:-false}"

  timeouts:
    message_reception: "${ENV_MESSAGE_TIMEOUT:-5.0}"

# InteractionSolver Agent Configuration
interaction_solver:
  jid: "interaction_solver@localhost"
  password: "${SPADE_INTERACTION_SOLVER_PASSWORD}"

  planning:
    context_gathering:
      timeout: "${SIGNIFIER_MATCH_TIMEOUT:-10}"  # seconds — also used as env-ready timeout

    community:
      enabled: true
      api_url: null  # Set via COMMUNITY_API_URL env var or override here
      timeout: "${COMMUNITY_API_TIMEOUT:-10.0}"

    llm_planning:
      model: "gpt-4o-mini"
      temperature: 0.5
      max_tokens: 2000
      max_planning_attempts: 3  # retries for BT generation

# Request-type taxonomy used across agents (NLU classification labels).
# Reference list — keep in sync with UserAssistant prompts and EnvExplorer
# behaviour routing.
request_types:
  - ENV_CAPABILITIES
  - ENV_STATE
  - GOAL_REQUEST
  - PLAN_MANAGEMENT
  - PREFERENCE_MANAGEMENT

# LLM Configuration (shared across agents)
llm:
  default_provider: "openai"

  providers:
    openai:
      api_key: null  # Set via environment variable OPENAI_API_KEY
      model: "gpt-4o-mini"
      temperature: 0.5
      max_tokens: 1500

    anthropic:
      api_key: null  # Set via environment variable ANTHROPIC_API_KEY
      model: "claude-3-opus-20240229"
      temperature: 0.5
      max_tokens: 1500

  retry:
    timeout: "${LLM_TIMEOUT_DEFAULT:-30}"  # seconds

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  file_logging:
    enabled: true
    path: "logs/ami_agents.log"
    max_bytes: 10485760  # 10 MB
    backup_count: 5

  console_logging:
    enabled: true

# Demo environments configuration moved to environment.yaml
# Community signifier API configuration moved to environment.yaml

# Centralized Timeouts Configuration (consumed by various agents/clients)
timeouts:
  llm:
    default: "${LLM_TIMEOUT_DEFAULT:-30.0}"
    reasoning: "${LLM_TIMEOUT_REASONING:-120.0}"
  http:
    client: "${HTTP_CLIENT_TIMEOUT:-30.0}"
  community:
    api: "${COMMUNITY_API_TIMEOUT:-10.0}"
  homeassistant:
    api: "${HA_API_TIMEOUT:-10.0}"
  signifier:
    match: "${SIGNIFIER_MATCH_TIMEOUT:-10.0}"
  rpc:
    call: "${RPC_TIMEOUT:-15.0}"

# Behavior Tree Execution Limits
bt_execution:
  max_ticks:
    default: "${BT_MAX_TICKS_DEFAULT:-10}"
    user_assistant: "${BT_MAX_TICKS_USER_ASSISTANT:-50}"

# HTTP Client Configuration (timeout only — retry/status-code policy is in code)
http:
  client:
    timeout: "${HTTP_CLIENT_TIMEOUT:-30.0}"

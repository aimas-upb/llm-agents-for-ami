# Agent Configuration
# Defines settings for all agents in the AMI system

# SPADE Configuration
spade:
  host: "${SPADE_HOST:-localhost}"
  port: "${SPADE_PORT:-5222}"
  tls_enabled: "${SPADE_TLS:-false}"

# UserAssistant Agent Configuration
user_assistant:
  jid: "user_assistant@localhost"
  password: "${SPADE_USER_ASSISTANT_PASSWORD}"

  # Chat management
  chat:
    max_concurrent_conversations: 10
    conversation_timeout: "${CONVERSATION_TIMEOUT:-1800}"  # seconds (30 minutes)

    # Message classification settings
    classification:
      model: "gpt-4o-mini"  # or other LLM model identifier
      confidence_threshold: 0.7
      categories:
        - ENV_CAPABILITIES
        - ENV_STATE
        - GOAL_REQUEST
        - PLAN_MANAGEMENT
        - PREFERENCE_STATEMENT

  # Intent extraction
  intent_extraction:
    model: "gpt-4o-mini"
    max_retries: 3
    validation_enabled: true

  # Intent matching for existing goals
  intent_matching:
    similarity_threshold: 0.85
    context_matching_enabled: true
    context_similarity_threshold: 0.75

  # Plan management
  plan_management:
    storage_backend: "sqlite"  # or "postgresql", "mongodb"
    database_path: "data/plans.db"

    plan_types:
      - immediate  # One-time execution
      - maintenance  # Persistent, triggered goals

    metadata_fields:
      - goal_description
      - conversation_id
      - timestamp_created
      - timestamp_last_executed
      - execution_count

# EnvExplorer Agent Configuration
env_explorer:
  jid: "env_explorer@localhost"
  password: "${SPADE_ENV_EXPLORER_PASSWORD}"

  # Environment discovery
  discovery:
    initial_crawl_on_startup: true
    crawl_depth: -1  # -1 for unlimited
    parallel_requests: 5

    # Notification after initial discovery
    notify_on_discovery_complete: true
    notify_agents:
      - "user_assistant@localhost"
      - "interaction_solver@localhost"

  # Change detection
  change_detection:
    enabled: true
    polling_interval: 30  # seconds
    detect_events:
      - artifact_added
      - artifact_removed
      - capability_changed
      - state_changed

    # Plan impact analysis
    analyze_plan_impact: true

  # Signifier storage (usage experiences)
  signifiers:
    storage_backend: "sqlite"
    database_path: "data/signifiers.db"

    # Signifier matching
    intent_similarity_threshold: 0.8
    context_matching_enabled: true
    matcher_version: "v2"

    # Signifier extraction from plans
    extract_from_behavior_trees: true

  # Affordance matching
  affordance_matching:
    use_hybrid_reasoning: true  # Rule-based + LLM
    llm_model: "gpt-4o-mini"
    prioritize_signifiers: true
    physics_informed_modeling: true  # As per Ganesh Ramanathan approach

  # RD4 Engine Settings
  rd4_engine:
    default_matcher_version: "${SIGNIFIER_MATCHER_VERSION:-v2}"
    default_min_similarity: "${SIGNIFIER_MIN_SIMILARITY:-0.5}"
    signifier_limit: "${SIGNIFIER_LIMIT:-10000}"
    shacl_shape_version: "${SHACL_SHAPE_VERSION:-1}"
    shacl_cache_enabled: "${SHACL_CACHE_ENABLED:-false}"
    shacl_validation_enabled: "${SHACL_VALIDATION_ENABLED:-false}"

  # Timing Configuration
  timeouts:
    message_reception: "${ENV_MESSAGE_TIMEOUT:-5.0}"
    event_processing_sleep: "${ENV_EVENT_SLEEP:-2.0}"

  # Internal Processing
  processing:
    intent_types:
      - "EXPLICIT"
      - "IMPLICIT"

# InteractionSolver Agent Configuration
interaction_solver:
  jid: "interaction_solver@localhost"
  password: "${SPADE_INTERACTION_SOLVER_PASSWORD}"

  # Planning
  planning:
    # Context gathering
    context_gathering:
      from_env_explorer: true
      from_community: true  # Cross-environment signifier sharing
      timeout: "${SIGNIFIER_MATCH_TIMEOUT:-10}"  # seconds

    # Community signifier API (cross-environment sharing)
    community:
      enabled: true
      api_url: null  # Set via COMMUNITY_API_URL env var or override here
      timeout: "${COMMUNITY_API_TIMEOUT:-10.0}"  # seconds for community API requests

    # LLM-based planning (BT JSON IR generation)
    llm_planning:
      model: "gpt-4o-mini"
      temperature: 0.5
      max_tokens: 2000

      # Behavior Tree generation
      output_format: "behavior_tree"
      max_planning_attempts: 3  # retries for BT generation

      # Node template features
      node_template_features:
        - status_tracking  # running, done, failed
        - expected_duration
        - retry_policy
        - error_handling

  # Plan execution monitoring
  execution_monitoring:
    enabled: true
    status_update_interval: 5  # seconds

  # Signifier matching
  signifiers:
    matcher_version: "${SIGNIFIER_MATCHER_VERSION:-v2}"

# LLM Configuration (shared across agents)
llm:
  default_provider: "openai"

  providers:
    openai:
      api_key: null  # Set via environment variable OPENAI_API_KEY
      model: "gpt-4o-mini"
      temperature: 0.5
      max_tokens: 1500

    anthropic:
      api_key: null  # Set via environment variable ANTHROPIC_API_KEY
      model: "claude-3-opus-20240229"
      temperature: 0.5
      max_tokens: 1500

  # Retry configuration
  retry:
    max_attempts: 3
    backoff_factor: 2
    timeout: "${LLM_TIMEOUT_DEFAULT:-30}"  # seconds

# Memory Configuration (shared across agents)
memory:
  conversation_memory:
    backend: "sqlite"
    database_path: "data/conversations.db"
    max_history_per_conversation: 100
    summarization_enabled: true
    summarization_threshold: 50  # messages

  # Vector store for semantic search
  vector_store:
    enabled: true
    backend: "chromadb"  # or "faiss", "pinecone"
    embedding_model: "text-embedding-ada-002"
    collection_name: "ami_memories"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  file_logging:
    enabled: true
    path: "logs/ami_agents.log"
    max_bytes: 10485760  # 10 MB
    backup_count: 5

  console_logging:
    enabled: true

# Demo environments configuration moved to environment.yaml
# Community signifier API configuration moved to environment.yaml

# Integration Engine Configuration
integration_engine:
  agent_webid_template: "${BASE_WS_URI}/agents/{agent_name}"
  default_agent_name: "alex"

# Centralized Timeouts Configuration
timeouts:
  llm:
    default: "${LLM_TIMEOUT_DEFAULT:-30.0}"
    reasoning: "${LLM_TIMEOUT_REASONING:-120.0}"
  http:
    client: "${HTTP_CLIENT_TIMEOUT:-30.0}"
  community:
    api: "${COMMUNITY_API_TIMEOUT:-10.0}"
  homeassistant:
    api: "${HA_API_TIMEOUT:-10.0}"
  signifier:
    match: "${SIGNIFIER_MATCH_TIMEOUT:-10.0}"
  rpc:
    call: "${RPC_TIMEOUT:-15.0}"

# Centralized Thresholds Configuration
signifiers:
  min_similarity: "${SIGNIFIER_MIN_SIMILARITY:-0.5}"
  matcher_version: "${SIGNIFIER_MATCHER_VERSION:-v2}"

# Behavior Tree Execution Limits
bt_execution:
  max_ticks:
    default: "${BT_MAX_TICKS_DEFAULT:-10}"
    user_assistant: "${BT_MAX_TICKS_USER_ASSISTANT:-50}"

# HTTP Client Configuration
http:
  client:
    timeout: "${HTTP_CLIENT_TIMEOUT:-30.0}"
    max_retries: "${HTTP_MAX_RETRIES:-3}"
    retry_status_codes: [408, 429, 500, 502, 503, 504]

version: 1

semantic:
  # Read by HASP (via SEMANTIC_CONFIG), overriding semantic_mappings.yaml. Only
  # what Home Assistant cannot tell is here; every room variable, its sensors
  # and the lights' and climate's effects are derived from the deployment.
  #   location_class   the room the area is
  #   environments     environments beside the room's own (no place has them)
  #   devices          per device: device_class, properties, commands,
  #                    zone (a second variable of the same class in the room),
  #                    environment (observes / acts on another environment),
  #                    effects (replace the defaults; see semantic_mappings.yaml)
  #   ranges           comfort targets, by variable name
  location_class: "homeont:StudyRoom"
  environments:
    outdoor: {label: "Outdoor environment"}
  devices:
    ceiling_fan_308e:
      # A fan wired as an HA switch: HA cannot tell it is a fan, nor that the
      # lab's model has it cool the room.
      device_class: "homeont:Fan"
      effects:
        - {class: "homeont:AirTemperature", services: [turn_on, turn_off], turn_on: decrease, turn_off: increase}
    glare_sensing_308e:
      # A bare "%" sensor: the unit alone does not say what it measures.
      device_class: "homeont:GlareSensor"
      properties:
        state: "homeont:Glare"
    desk_light_sensing_308e:
      zone: desk                  # observes desk_illuminance, not the room's
    desk_lamp_308e:
      zone: desk                  # its light moves desk_illuminance
    external_light_sensing_308e:
      environment: outdoor        # observes outdoor_illuminance
    blackout_blinds_308e:
      # Blocks direct sunlight: moves glare rather than the room's light level.
      effects:
        - {class: "homeont:Glare", services: [open_cover, close_cover, set_cover_position]}
    window_308e:
      # Opening it ventilates: CO2 falls.
      effects:
        - {class: "homeont:CarbonDioxideConcentration", services: [open_cover, close_cover],
           open_cover: decrease, close_cover: increase}
  ranges:
    illuminance: {min: 200, unit: lx}
    desk_illuminance: {min: 300, unit: lx}
    glare: {max: 50, unit: percent}
    carbon_dioxide_concentration: {max: 2100, unit: ppm}
    air_temperature: {max: 24, unit: degC}
    relative_humidity: {min: 30, max: 60, unit: percent}

devices:
  ambient_lights_308e:
    - platform: light
      support_brightness: true
      support_color: true
      initial_value: "off"
      initial_brightness: 96

  task_lights_308e:
    - platform: light
      support_brightness: true
      support_color: true
      initial_value: "off"
      initial_brightness: 128

  desk_lamp_308e:
    - platform: light
      support_brightness: true
      initial_value: "off"
      initial_brightness: 140

  blinds_308e:
    - platform: cover
      initial_value: "closed"
      open_close_duration: 30
      open_close_tick: 1

  blackout_blinds_308e:
    - platform: cover
      initial_value: "open"
      open_close_duration: 20
      open_close_tick: 1

  window_308e:
    - platform: cover
      initial_value: "closed"
      open_close_duration: 15
      open_close_tick: 1

  projector_308e:
    - platform: media_player
      name: projector_308e
      initial_value: "off"
      initial_volume: 0.15

  display_wall_308e:
    - platform: media_player
      name: display_wall_308e
      initial_value: "on"
      initial_volume: 0.0

  ceiling_fan_308e:
    - platform: switch
      name: ceiling_fan_308e
      initial_value: "off"

  air_conditioner_308e:
    - platform: climate
      name: air_conditioner_308e
      initial_hvac_mode: "cool"
      initial_temperature: 24
      min_temp: 18
      max_temp: 30
      target_temp_step: 0.5

  heater_308e:
    - platform: climate
      name: heater_308e
      initial_hvac_mode: "heat"
      initial_temperature: 20
      min_temp: 16
      max_temp: 28
      target_temp_step: 0.5

  internal_light_sensing_308e:
    - platform: sensor
      name: internal_light_sensing_308e
      class: illuminance
      unit_of_measurement: lx
      initial_value: 180

  desk_light_sensing_308e:
    - platform: sensor
      name: desk_light_sensing_308e
      class: illuminance
      unit_of_measurement: lx
      initial_value: 120

  glare_sensing_308e:
    - platform: sensor
      name: glare_sensing_308e
      unit_of_measurement: "%"
      initial_value: 75

  external_light_sensing_308e:
    - platform: sensor
      name: external_light_sensing_308e
      class: illuminance
      unit_of_measurement: lx
      initial_value: 5200

  temperature_sensing_308e:
    - platform: sensor
      name: temperature_sensing_308e
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 26

  humidity_sensing_308e:
    - platform: sensor
      name: humidity_sensing_308e
      class: humidity
      unit_of_measurement: "%"
      initial_value: 62

  co2_sensing_308e:
    - platform: sensor
      name: co2_sensing_308e
      unit_of_measurement: ppm
      initial_value: 980

  person_counter_308e:
    - platform: sensor
      name: person_counter_308e
      unit_of_measurement: persons
      initial_value: 3

  presence_sensing_308e:
    - platform: binary_sensor
      name: presence_sensing_308e
      class: occupancy
      initial_value: "on"

  clock_308e:
    - platform: sensor
      name: clock_308e
      class: timestamp

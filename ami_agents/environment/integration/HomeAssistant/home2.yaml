version: 1

devices:
  home2_lights_kitchen:
    - platform: light
      name: Home2.Kitchen.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lights_dining:
    - platform: light
      name: Home2.Dining.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lights_living_roon:
    - platform: light
      name: Home2.LivingRoom.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lights_hall:
    - platform: light
      name: Home2.Hall.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lights_entry:
    - platform: light
      name: Home2.Entry.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lights_bath:
    - platform: light
      name: Home2.Bath.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lights_bedroom:
    - platform: light
      name: Home2.Bedroom.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_lamp_living_roon:
    - platform: light
      name: Home2.LivingRoom.Lamp
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home2_clock:
    - platform: sensor
      name: Home2.Clock
      class: timestamp
  
  home2_local_weather:
    - platform: sensor
      name: Home2.LocalWeather.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 18

    - platform: sensor
      name: Home2.LocalWeather.Humidity
      class: humidity
      unit_of_measurement: "%"
      initial_value: 65

    - platform: sensor
      name: Home2.LocalWeather.Pressure
      class: pressure
      unit_of_measurement: "hPa"
      initial_value: 1012

    - platform: sensor
      name: Home2.LocalWeather.Condition
      initial_value: "cloudy"
  
  home2_user_location:
    - platform: sensor
      name: Home2.UserLocation.Latitude
      unit_of_measurement: "°"
      initial_value: 44.4353        # example: Bucharest

    - platform: sensor
      name: Home2.UserLocation.Longitude
      unit_of_measurement: "°"
      initial_value: 26.1024        # example: Bucharest

    - platform: sensor
      name: Home2.UserLocation.Accuracy
      unit_of_measurement: "m"
      initial_value: 10

    - platform: sensor
      name: Home2.UserLocation.State
      initial_value: "home"         # home / away / work / unknown

  home2_kitchen_sensors:
    - platform: binary_sensor
      name: Home2.Kitchen.AreaMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home2.Kitchen.FridgeMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home2.Kitchen.FreezerMotion
      class: motion
      initial_value: "off"

  home2_dining_sensors:
    - platform: binary_sensor
      name: Home2.Dining.AreaMotion
      class: motion
      initial_value: "off"

  home2_living_room_sensors:
    - platform: binary_sensor
      name: Home2.LivingRoom.AreaMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home2.LivingRoom.CouchMotion
      class: occupancy          # sitting / lying on couch
      initial_value: "off"

    - platform: sensor
      name: Home2.LivingRoom.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 21

    - platform: sensor
      name: Home2.LivingRoom.Luminosity
      class: illuminance
      unit_of_measurement: "lx"
      initial_value: 120

  home2_bedroom_sensors:
    - platform: binary_sensor
      name: Home2.Bedroom.AreaMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home2.Bedroom.BedMotion
      class: occupancy          # in bed / not in bed
      initial_value: "off"

    - platform: sensor
      name: Home2.Bedroom.Luminosity
      class: illuminance
      unit_of_measurement: "lx"
      initial_value: 50

  home2_entry_sensors:
    - platform: binary_sensor
      name: Home2.Entry.AreaMotion
      class: motion
      initial_value: "off"

    - platform: sensor
      name: Home2.Entry.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 20

  home2_hall_sensors:
    - platform: binary_sensor
      name: Home2.Hall.AreaMotion
      class: motion
      initial_value: "off"

  home2_bath_sensors:
    - platform: binary_sensor
      name: Home2.Bath.AreaMotion
      class: motion
      initial_value: "off"

    - platform: sensor
      name: Home2.Bath.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 22

  home2_kitchen_thermostat:
    - platform: climate
      name: Home2.Kitchen.Thermostat
      initial_hvac_mode: "heat"   # off / heat / cool / auto
      initial_temperature: 21      # °C
      min_temp: 16
      max_temp: 28
      target_temp_step: 0.5
  
  home2_living_room_tv:
    - platform: media_player
      name: Home2.LivingRoom.TV
      initial_value: "on"         # on / off
      initial_volume: 0.3          # 0.0–1.0

  home2_living_room_speaker:
    - platform: speaker
      name: Home2.LivingRoom.Speaker
      initial_value: 'on'
      initial_volume: 0.4
      initial_muted: false
      volume_step: 0.05
      support_volume_set: true
      support_volume_step: true
      support_mute: true
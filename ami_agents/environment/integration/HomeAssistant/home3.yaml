version: 1

devices:
  home3_lights_kitchen:
    - platform: light
      name: Home3.Kitchen.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lights_dining:
    - platform: light
      name: Home3.Dining.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lights_living_roon:
    - platform: light
      name: Home3.LivingRoom.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lights_hall:
    - platform: light
      name: Home3.Hall.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lights_entry:
    - platform: light
      name: Home3.Entry.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lights_bath:
    - platform: light
      name: Home3.Bath.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lights_bedroom:
    - platform: light
      name: Home3.Bedroom.Lights
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_lamp_living_roon:
    - platform: light
      name: Home3.LivingRoom.Lamp
      support_brightness: true
      initial_value: 'off'        # on / off
      initial_brightness: 128     # 0-255 ≈ 50 %

  home3_clock:
    - platform: sensor
      name: Home3.Clock
      class: timestamp
  
  home3_local_weather:
    - platform: sensor
      name: Home3.LocalWeather.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 18

    - platform: sensor
      name: Home3.LocalWeather.Humidity
      class: humidity
      unit_of_measurement: "%"
      initial_value: 65

    - platform: sensor
      name: Home3.LocalWeather.Pressure
      class: pressure
      unit_of_measurement: "hPa"
      initial_value: 1012

    - platform: sensor
      name: Home3.LocalWeather.Condition
      initial_value: "cloudy"
  
  home3_user_location:
    - platform: sensor
      name: Home3.UserLocation.Latitude
      unit_of_measurement: "°"
      initial_value: 44.4353        # example: Bucharest

    - platform: sensor
      name: Home3.UserLocation.Longitude
      unit_of_measurement: "°"
      initial_value: 26.1024        # example: Bucharest

    - platform: sensor
      name: Home3.UserLocation.Accuracy
      unit_of_measurement: "m"
      initial_value: 10

    - platform: sensor
      name: Home3.UserLocation.State
      initial_value: "home"         # home / away / work / unknown

  home3_kitchen_sensors:
    - platform: binary_sensor
      name: Home3.Kitchen.AreaMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home3.Kitchen.FridgeMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home3.Kitchen.FreezerMotion
      class: motion
      initial_value: "off"

  home3_dining_sensors:
    - platform: binary_sensor
      name: Home3.Dining.AreaMotion
      class: motion
      initial_value: "off"

  home3_living_room_sensors:
    - platform: binary_sensor
      name: Home3.LivingRoom.AreaMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home3.LivingRoom.CouchMotion
      class: occupancy          # sitting / lying on couch
      initial_value: "off"

    - platform: sensor
      name: Home3.LivingRoom.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 21

    - platform: sensor
      name: Home3.LivingRoom.Luminosity
      class: illuminance
      unit_of_measurement: "lx"
      initial_value: 120

  home3_bedroom_sensors:
    - platform: binary_sensor
      name: Home3.Bedroom.AreaMotion
      class: motion
      initial_value: "off"

    - platform: binary_sensor
      name: Home3.Bedroom.BedMotion
      class: occupancy          # in bed / not in bed
      initial_value: "off"

    - platform: sensor
      name: Home3.Bedroom.Luminosity
      class: illuminance
      unit_of_measurement: "lx"
      initial_value: 50

  home3_entry_sensors:
    - platform: binary_sensor
      name: Home3.Entry.AreaMotion
      class: motion
      initial_value: "off"

    - platform: sensor
      name: Home3.Entry.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 20

  home3_hall_sensors:
    - platform: binary_sensor
      name: Home3.Hall.AreaMotion
      class: motion
      initial_value: "off"

  home3_bath_sensors:
    - platform: binary_sensor
      name: Home3.Bath.AreaMotion
      class: motion
      initial_value: "off"

    - platform: sensor
      name: Home3.Bath.Temperature
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 22

  home3_kitchen_thermostat:
    - platform: climate
      name: Home3.Kitchen.Thermostat
      initial_hvac_mode: "heat"   # off / heat / cool / auto
      initial_temperature: 21      # °C
      min_temp: 16
      max_temp: 28
      target_temp_step: 0.5
  
  home3_living_room_tv:
    - platform: media_player
      name: Home3.LivingRoom.TV
      initial_value: "on"         # on / off
      initial_volume: 0.3          # 0.0–1.0

  home3_living_room_speaker:
    - platform: speaker
      name: Home3.LivingRoom.Speaker
      initial_value: 'on'
      initial_volume: 0.4
      initial_muted: false
      volume_step: 0.05
      support_volume_set: true
      support_volume_step: true
      support_mute: true

  home3_living_room_blinds:
    - platform: cover
      name: Home3.LivingRoom.Blinds
      initial_value: "closed"        # open / closed
      open_close_duration: 30        # seconds
      open_close_tick: 1

  home3_kitchen_coffee_machine:
    - platform: switch
      name: Home3.Kitchen.CoffeeMachine
      initial_value: "off"

  home3_bedroom_humidifier:
    - platform: switch
      name: Home3.Bedroom.Humidifier
      initial_value: "off"

  home3_entry_smart_lock_keypad:
    - platform: binary_sensor
      name: Home3.Entry.Keypad
      class: occupancy   # keypad activity
      initial_value: "off"

  home3_house_security_camera:
    - platform: binary_sensor
      name: Home3.House.SecurityCamera
      class: motion
      initial_value: "off"

  home3_living_room_vacuum:
    - platform: switch
      name: Home3.LivingRoom.Vacuum
      initial_value: "off"      # off = docked, on = cleaning

    - platform: sensor
      name: Home3.LivingRoom.Vacuum.Battery
      class: battery
      unit_of_measurement: "%"
      initial_value: 80
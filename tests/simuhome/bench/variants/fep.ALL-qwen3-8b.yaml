# Single-model baseline: every reasoning phase on Qwen3-8B (thinking) served
# by Ollama on the GPU node; the judge on OpenAI as in every other run. This
# is the "one small model end to end" row against which the per-phase mixes
# (M1, M2, MIX) are compared.
name: fep-ALL-qwen3-8b

providers:
  local:  {base_url: "http://localhost:11434/v1"}
  openai: {api_key_env: OPENAI_API_KEY}

models:
  segmentation:  {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 8192}
  structuring:   {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 8192}
  planning:
    explicit:    {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 8192}
    general:     {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 8192}
  profiling:     {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 4096}
  guarding:      {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 2048}
  response:      {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 2048}
  judge:         {provider: openai, model: gpt-4o-mini, temperature: 0.5}

run:
  episodes: "qt*"
  limit: null
  workers: 4
  context: prepend        # as the gpt-6-luna reference run
  memory: "off"

evaluate:
  judge: true

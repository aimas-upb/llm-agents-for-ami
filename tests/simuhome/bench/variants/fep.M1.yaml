# Config M1 of the local-model grid: every reasoning phase on an open-weight
# model served by Ollama on the GPU node (slurm_harness.sbatch rewrites the
# local URL to the job's port); only the judge is on OpenAI, as in every other
# run, so scores compare. Model assignment follows the team's split: a
# thinking model for segmentation, structuring and profiling, a coding model
# for planning and the reply, a small model for guarding.
name: fep-M1-qwen3-8b_coder-7b

providers:
  local:  {base_url: "http://localhost:11434/v1"}
  openai: {api_key_env: OPENAI_API_KEY}

models:
  segmentation:  {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 8192}
  structuring:   {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 8192}
  planning:
    explicit:    {provider: local, model: "qwen2.5-coder:7b-instruct", temperature: 0, max_tokens: 4096}
    general:     {provider: local, model: "qwen2.5-coder:7b-instruct", temperature: 0, max_tokens: 4096}
  profiling:     {provider: local, model: "qwen3:8b", temperature: 0, max_tokens: 4096}
  guarding:      {provider: local, model: "gemma3:1b", temperature: 0, max_tokens: 1024}
  response:      {provider: local, model: "qwen2.5-coder:7b-instruct", temperature: 0, max_tokens: 1024}
  judge:         {provider: openai, model: gpt-4o-mini, temperature: 0.5}

run:
  episodes: "qt*"
  limit: null
  workers: 4
  context: prepend        # as the gpt-6-luna reference run
  memory: "off"

evaluate:
  judge: true

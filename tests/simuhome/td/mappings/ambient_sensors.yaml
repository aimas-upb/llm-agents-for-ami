# HAND-WRITTEN. Not generated by convert.py: these sensors do not exist in
# SimuHome and so cannot be scanned out of the episodes.
#
# SimuHome computes each room variable from the appliances that affect it and
# serves the result through get_room_states(). It has no instrument that reads
# one -- a light changes a room's illuminance, it does not measure it. A
# deployable home has the instruments, so SHTD mints one virtual sensor per
# variable a room reports, and serves the simulator's own value through it.
#
# `key` is the room-state token SimuHome reports. Everything about the
# PROPERTY -- its homeont class, unit, quantity kind -- comes from
# `room_state_property(<key>)` in observable_properties.yaml and is not
# restated here; these rows say only what the DEVICE is.
version: 1
rows:
- key: temperature
  family: temperature_sensor
  homeont_class: homeont:TemperatureSensor
  title: Temperature Sensor
  status: approved
- key: humidity
  family: humidity_sensor
  homeont_class: homeont:HumiditySensor
  title: Humidity Sensor
  status: approved
- key: illuminance
  family: light_sensor
  homeont_class: homeont:LightSensor
  title: Light Sensor
  status: approved
- key: pm10
  family: air_quality_sensor
  homeont_class: homeont:AirQualitySensor
  title: Air Quality Sensor
  status: approved

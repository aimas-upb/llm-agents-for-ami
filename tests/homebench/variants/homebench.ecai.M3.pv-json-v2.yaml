# HomeBench harness config, ECAI-400 on local models: M3 with ONE change to how structuring
# builds its call (experiment arm F; the control is homebench.ecai.M3.yaml, nothing set):
#   prompt_variants.structuring   context: json_v2
#
# The home context is sent to structuring as indented JSON (EnvExplorer's structured
# view, nulls dropped), like arm C (homebench.ecai.M3.pv-json.yaml, `context: json`), but
# with version 2 of the prompt: the guide explains every key the JSON has, and the RULES
# are reworded in those keys (`title`, `command_types`, `acts_upon`, `homeont_types`, ...)
# instead of the text format's words (`Artifact`, `name`, `command class`, `acts upon`).
# Arm C left a small model to translate the one into the other; this arm does not.
# Facts, models, run settings and episodes are M3's and arm C's, so the difference between
# C and F is the wording of the prompt, and between F and the control, the format and
# the wording together.
#
# Details: tests/homebench/prompt-variants.md. Nothing is run by reading this file:
#
#   conda run -n ami-agents python -m tests.simuhome.bench.harness \
#       --config tests/homebench/variants/homebench.ecai.M3.pv-json-v2.yaml --dry-run

suite: homebench
benchmark: tests/homebench/ecai400   # the 400 ECAI episodes, corrections applied

providers:
  local: {base_url: "http://localhost:11434/v1"}     # Ollama; the planner needs tool calling

models:
  segmentation:  {provider: local, model: "qwen3-8b-16k", temperature: 0}
  structuring:   {provider: local, model: "ds-r1-7b-16k", temperature: 0}
  planning:
    explicit:    {provider: local, model: "qwen2.5-coder-7b-16k", temperature: 0}
    general:     {provider: local, model: "qwen2.5-coder-7b-16k", temperature: 0}
  profiling:     {provider: local, model: "ds-r1-7b-16k", temperature: 0}
  guarding:      {provider: local, model: "ds-r1-1.5b-16k", temperature: 0}
  response:      {provider: local, model: "qwen2.5-coder-7b-16k", temperature: 0}

run:
  episodes: "hb*"          # every episode of the benchmark directory above
  limit: null
  workers: 1               # one local model at a time: parallel workers only queue on it
  context: none
  memory: "off"
  guidelines: homebench    # homebench: no device conditions | default: as deployed
  environment: "on"        # as the ECAI run (env_on): room environments and action effects

# How structuring builds its prompt (ami_agents/shared/utils/prompt_variants.py):
#   json_v2 = JSON context + guide v2 + the rules in the JSON's keys (version 2 of the JSON
#   prompt; `json` is version 1, kept as arm C ran).
prompt_variants:
  structuring: {context: json_v2}

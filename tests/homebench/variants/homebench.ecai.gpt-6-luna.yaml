# HomeBench harness config, ECAI on gpt-6-luna: the 400 episodes of the ECAI evaluation
# (tests/homebench/results/HB_gpt6-luna/episodes.csv), every phase on the OpenAI API.
#
#   400 episodes, about 1,900 LLM calls (4.8 per episode in the ECAI run), no judge calls,
#   about 20-25 minutes with 4 workers. Nothing is run by --dry-run:
#
#   conda run -n ami-agents python -m tests.simuhome.bench.harness \
#       --config tests/homebench/variants/homebench.ecai.gpt-6-luna.yaml --dry-run
#
# The records directory is named after the file (no `name:` key):
# <out>/homebench.ecai.gpt-6-luna/.

suite: homebench

providers:
  openai: {api_key_env: OPENAI_API_KEY}

models:
  segmentation:  {provider: openai, model: gpt-6-luna, reasoning_effort: low}
  structuring:   {provider: openai, model: gpt-6-luna, reasoning_effort: low}
  planning:
    explicit:    {provider: openai, model: gpt-6-luna, reasoning_effort: low}
    general:     {provider: openai, model: gpt-6-luna, reasoning_effort: medium}
  profiling:     {provider: openai, model: gpt-6-luna, reasoning_effort: low}
  guarding:      {provider: openai, model: gpt-6-luna, reasoning_effort: low}
  response:      {provider: openai, model: gpt-6-luna, reasoning_effort: low}


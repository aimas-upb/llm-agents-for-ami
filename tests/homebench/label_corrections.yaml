# HomeBench ground-truth corrections, applied by tests/homebench/convert.py.
#
# Each row replaces the gold of one HomeBench test row (`id`, the dataset's own row id,
# stable across conversions). `episode` is its name before the correction; the corrected
# episode is renamed for its new case, same seed, with a `_fixed` suffix
# (hb1_infeasible_seed_2631 -> hb1_feasible_seed_2631_fixed), and its meta records the
# original gold and the reason (`meta.label_correction`).
#
# These kinds, all in the ECAI-400 episodes only:
# * labelled `unexist_attribute` ("the light has no brightness") although HomeBench's own
#   home file gives that light a brightness (0-100) and its method list a set_brightness:
#   the request can be done, so the gold is the call it asks for. "minimum" / "lowest
#   level" is the device's lowest value, 0. The same contradiction exists in 653 other
#   rows of the full set, left as HomeBench labels them.
# * a part whose request names an attribute the device does not have ("the curtain's
#   intensity") while the gold sets another one (its degree): by HomeBench's own rule
#   for a missing attribute, that part is `error_input`. `attribute` names what is
#   missing; the rest of the gold is unchanged.
# * a part labelled `error_input` although the device can do it (a light with a
#   brightness, or one that can be turned off).
# * a "by N" change whose gold is not the start value changed by N, or ignores a
#   previous change of the same device the request makes first ("then", "further").
#   A percent change of a 0-100 percent setting adds points.
# * a part whose request gives no value ("an unspecified degree"): `error_input`, with
#   `part_reason: unspecified_value`.
# Each row's `reason` says which, with the numbers.
